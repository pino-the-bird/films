# a short film of his, cut here when the town asks (cut.json), so that nothing is cut on the town's server. the town puts
# this file here (world/Films.js) and reads what it makes (films/<id>/) from the commit that made it. a push of its own
# does not start it again
name: cut
on:
  push:
    branches: [main]
    paths: ['cut.json']
  workflow_dispatch:
concurrency:
  group: cut
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: node .github/cut.mjs
      - name: keep it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add films
          git diff --cached --quiet || { git commit -m "a film, cut"; git pull --rebase; git push; }
